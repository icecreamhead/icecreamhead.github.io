<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Doorpac Derby</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

    :root{
      --pitch-0:#0d1712;
      --pitch-1:#132119;
      --pitch-2:#1b2e22;
      --line:#2e4436;
      --paper:#ece6d6;
      --paper-dim:#a9a794;
      --gold:#c9a227;
      --gold-dim:#8f7420;
      --red:#b5544a;
      --radius:2px;
    }

    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:var(--pitch-0);
      background-image:
              repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 46px);
      color:var(--paper);
      font-family:'Inter', sans-serif;
      min-height:100vh;
      line-height:1.45;
    }

    .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

    /* ---------- Masthead ---------- */
    .masthead{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:20px;
      border-bottom:3px solid var(--gold);
      padding-bottom:16px;
      margin-bottom:6px;
      flex-wrap:wrap;
    }
    .masthead h1{
      font-family:'Bebas Neue', sans-serif;
      font-size:clamp(40px,7vw,64px);
      letter-spacing:1px;
      margin:0;
      line-height:0.9;
      color:var(--paper);
    }
    .masthead .rule{
      color:var(--gold);
    }
    .masthead-right{
      text-align:right;
      font-size:13px;
      color:var(--paper-dim);
      padding-bottom:6px;
    }
    .strap{
      font-size:14.5px;
      color:var(--paper-dim);
      margin:6px 0 26px;
      max-width:60ch;
    }
    .strap b{color:var(--paper); font-weight:600;}

    /* ---------- Blocks ---------- */
    .block{
      background:var(--pitch-1);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:20px;
      margin-bottom:18px;
    }
    .block h2{
      font-family:'Bebas Neue', sans-serif;
      font-size:22px;
      letter-spacing:0.5px;
      margin:0 0 4px;
      color:var(--paper);
    }
    .block {
      font-size:13px;
      color:var(--paper-dim);
      margin:0 0 16px;
    }

    .btn{
      font-family:'Inter',sans-serif;
      font-weight:600;
      font-size:13.5px;
      background:var(--gold);
      color:var(--pitch-0);
      border:none;
      padding:9px 16px;
      border-radius:var(--radius);
      cursor:pointer;
      letter-spacing:0.2px;
    }
    .btn:hover{background:#ddb541;}
    .btn:disabled{background:var(--gold-dim); cursor:progress; opacity:0.7;}

    .status-line{font-size:13px; margin-top:12px; padding:10px 12px; border-radius:var(--radius); display:none;}
    .status-line.show{display:block;}
    .status-ok{background:rgba(201,162,39,0.1); border:1px solid var(--gold-dim); color:var(--gold);}
    .status-err{background:rgba(181,84,74,0.12); border:1px solid var(--red); color:#e2a49d;}
    .status-info{background:rgba(255,255,255,0.04); border:1px solid var(--line); color:var(--paper-dim);}

    .empty{
      border:1px dashed var(--line);
      border-radius:var(--radius);
      padding:22px;
      text-align:center;
      color:var(--paper-dim);
      font-size:13.5px;
    }

    /* ---------- Leaderboard ---------- */
    .lb-row{
      display:grid;
      grid-template-columns:34px 1fr auto;
      gap:12px;
      align-items:center;
      padding:12px 8px;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .lb-row:first-child{border-top:1px solid rgba(255,255,255,0.06);}
    .lb-rank{
      font-family:'Bebas Neue',sans-serif;
      font-size:24px;
      color:var(--paper-dim);
    }
    .lb-row.lead .lb-rank{color:var(--gold);}
    .lb-name{font-weight:600; font-size:15px;}
    .lb-count{font-family:'Inter',sans-serif; font-weight:500; font-size:11px; color:var(--paper-dim); margin-left:6px;}
    .lb-breakdown{font-size:12px; color:var(--paper-dim); margin-top:3px;}
    .lb-total{
      font-family:'Bebas Neue',sans-serif;
      font-size:26px;
      color:var(--paper);
      text-align:right;
      min-width:56px;
    }
    .lb-row.lead .lb-total{color:var(--gold);}
    .lb-total .unit{font-family:'Inter',sans-serif; font-size:11px; color:var(--paper-dim); display:block; margin-top:-4px;}

    .control-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }

    /* ---------- Desktop: picks always visible, no toggle button ---------- */
    .lb-breakdown table{
      width:100%;
      font-size:13px;
    }
    .lb-breakdown td{
      padding:4px 6px;
      border-bottom:1px solid rgba(255,255,255,0.03);
    }
    .toggle-picks{
      display:none;
    }

    /* ---------- Mobile optimizations ---------- */
    @media(max-width:640px){
      .wrap{padding:16px 12px 60px;}
      .masthead{gap:8px; margin-bottom:4px;}
      .masthead h1{font-size:clamp(28px,6vw,48px);}
      .strap{font-size:13px; margin:6px 0 18px;}
      .block{padding:16px; margin-bottom:14px;}
      .block h2{font-size:18px; margin-bottom:2px;}

      .control-bar{gap:8px;}

      .lb-row{
        grid-template-columns:28px 1fr auto;
        gap:8px;
        padding:10px 4px;
      }
      .lb-rank{font-size:18px;}
      .lb-name{font-size:14px;}
      .lb-count{display:none;}
      .lb-total{font-size:20px; min-width:48px;}

      /* Hide picks by default on mobile */
      .lb-breakdown{
        display:none;
        margin-top:6px;
      }
      .lb-breakdown.expanded{
        display:block;
      }
      .lb-breakdown table{font-size:12px;}
      .lb-breakdown td{padding:3px 4px;}

      /* Show toggle button on mobile only */
      .toggle-picks{
        display:inline-block;
        font-family:'Inter',sans-serif;
        font-weight:500;
        font-size:11px;
        background:none;
        border:1px solid var(--line);
        color:var(--paper-dim);
        padding:4px 8px;
        border-radius:var(--radius);
        cursor:pointer;
        margin-top:6px;
        transition:all 0.2s;
      }
      .toggle-picks:active{
        border-color:var(--gold);
        color:var(--gold);
      }

      .btn{padding:7px 12px; font-size:12px;}

      footer{font-size:11px; margin-top:30px; padding-top:10px;}
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Doorpac Derby <span class="rule" id="headerBadge"></span></h1>
    <div class="masthead-right" id="seasonBadge" style="visibility: hidden"></div>
  </div>
  <p class="strap">Four clubs from each division. Add up the league positions. Lowest score wins.</p>

  <div class="block">
    <div class="control-bar">
      <h2 style="margin:0;">Standings</h2>
      <button class="btn" id="refreshBtn" style="visibility: hidden">Refresh standings</button>
    </div>
    <div id="boardArea"></div>
    <div class="status-line" id="refreshStatus"></div>
  </div>
</div>

<script type="application/json" id="playersFallback">{"season":2026,"players":[]}</script>

<script>
  (function(){
    "use strict";

    const DIVISIONS = [
      {id:"eng.1", name:"Premier League", tier:1},
      {id:"eng.2", name:"Championship", tier:2},
      {id:"eng.3", name:"League One", tier:3},
      {id:"eng.4", name:"League Two", tier:4},
      {id:"eng.5", name:"National League", tier:5},
    ];

    const state = {
      season: String(new Date().getMonth() >= 6 ? new Date().getFullYear() : new Date().getFullYear() - 1),
      standings: {},
      players: [],
    };

    // ---------- load player picks from teams.json ----------
    async function loadPlayers(){
      try{
        const res = await fetch("teams.json", { cache: "no-store" });
        if(res.ok){
          const data = await res.json();
          if(data && data.players && Array.isArray(data.players)) {
            return { season: data.season, players: data.players };
          }
        }
      }catch(e){ /* fall through to embedded copy */ }
      try{
        const el = document.getElementById("playersFallback");
        const data = JSON.parse(el.textContent);
        return { season: data.season, players: data.players || [] };
      }catch(e){ return { season: 2026, players: [] }; }
    }

    // ---------- storage helpers ----------
    async function safeGet(key, shared, fallback){
      try{
        const r = await window.storage.get(key, shared);
        if(!r) return fallback;
        return JSON.parse(r.value);
      }catch(e){ return fallback; }
    }
    async function safeSet(key, shared, value){
      try{
        await window.storage.set(key, JSON.stringify(value), shared);
        return true;
      }catch(e){ console.error("storage set failed", key, e); return false; }
    }

    // ---------- dom helpers ----------
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    function esc(s){
      return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function setStatus(el, kind, msg){
      //el.className = "status-line show status-"+kind;
      el.textContent = msg;
    }
    function clearStatus(el){
      el.className = "status-line";
      el.textContent = "";
    }

    // ---------- fetch standings from worldcup26.ir ----------
    function findEntriesArray(data){
      if(Array.isArray(data)) return data;
      if(!data || typeof data !== "object") return null;
      if(Array.isArray(data.standings)) return data.standings;
      if(data.standings && Array.isArray(data.standings.entries)) return data.standings.entries;
      if(Array.isArray(data.entries)) return data.entries;
      if(Array.isArray(data.children)){
        const merged = [];
        data.children.forEach(c=>{
          const sub = findEntriesArray(c.standings || c);
          if(sub) merged.push(...sub);
        });
        if(merged.length) return merged;
      }
      if(Array.isArray(data.groups)){
        const merged = [];
        data.groups.forEach(g=>{
          const sub = findEntriesArray(g.standings || g);
          if(sub) merged.push(...sub);
        });
        if(merged.length) return merged;
      }
      return null;
    }
    function readRank(entry, fallbackIndex){
      if(typeof entry.rank === "number") return entry.rank;
      const s = entry.stats;
      if(Array.isArray(s)){
        const hit = s.find(x=>x && (x.name==="rank" || x.type==="rank"));
        if(hit) return Number(hit.value ?? hit.displayValue);
      } else if(s && typeof s === "object"){
        if(typeof s.rank === "number") return s.rank;
        if(s.rank!=null) return Number(s.rank);
      }
      return fallbackIndex + 1;
    }
    function readPoints(entry){
      const s = entry.stats;
      if(Array.isArray(s)){
        const hit = s.find(x=>x && x.name==="points");
        if(hit) return hit.value ?? hit.displayValue;
      } else if(s && typeof s === "object" && s.points!=null){
        return s.points;
      }
      return null;
    }
    function readTeam(entry){
      const t = entry.team || entry.club || entry;
      return {
        id: String(t.id ?? t.uid ?? t.slug ?? t.name),
        name: t.displayName || t.name || t.shortDisplayName || "Unknown club",
      };
    }

    async function fetchDivision(leagueSlug){
      const url = `https://worldcup26.ir/get/soccer/${leagueSlug}/standings?season=${state.season}`;
      const res = await fetch(url);
      let data;
      try{ data = await res.json(); }
      catch(e){ throw new Error("Got an unreadable response (HTTP "+res.status+")."); }
      if(data && data.error){
        throw new Error("Source error: "+data.error);
      }
      if(!res.ok){
        throw new Error("HTTP "+res.status+" from worldcup26.ir.");
      }
      const entries = findEntriesArray(data);
      if(!entries || !entries.length){
        throw new Error("No standings for season "+state.season);
      }
      return  entries.map((entry, i)=>{
        const team = readTeam(entry);
        return { id: team.id, name: team.name, rank: readRank(entry, i), points: readPoints(entry) };
      }).sort((a,b)=>a.rank-b.rank);
    }

    async function refreshAllDivisions(statusEl){
      let succeeded = 0;
      setStatus(statusEl, "info", "Refreshing 5 divisions…");
      for(const div of DIVISIONS){
        try{
          const teams = await fetchDivision(div.id);
          state.standings[div.id] = { updatedAt: Date.now(), teams };
          succeeded++;
        }catch(e){
          setStatus(statusEl, "err", "Failed on "+div.name+": "+e.message);
          return;
        }
      }
      await safeSet("standings", true, state.standings);
      setStatus(statusEl, "ok", succeeded+" divisions updated.");
      renderBoard();
    }

    $("#refreshBtn").addEventListener("click", async ()=>{
      const btn = $("#refreshBtn");
      btn.disabled = true;
      await refreshAllDivisions($("#refreshStatus"));
      btn.disabled = false;
    });

    // ---------- leaderboard ----------
    function normalizeName(s){
      return String(s)
              .toLowerCase()
              .normalize("NFKD").replace(/[̀-ͯ]/g,"")
              .replace(/&/g," and ")
              .replace(/\./g,"")
              .replace(/\b(f\s?c|a\s?f\s?c|football club)\b/g,"")
              .replace(/[^a-z0-9]+/g," ")
              .trim();
    }
    function findLiveTeam(teams, name){
      const norm = normalizeName(name);
      let hit = teams.find(t=>normalizeName(t.name)===norm);
      if(hit) return hit;
      hit = teams.find(t=>{
        const tn = normalizeName(t.name);
        return tn && norm && (tn.includes(norm) || norm.includes(tn));
      });
      return hit || null;
    }

    function renderSeasonBadge(){
      $("#seasonBadge").textContent = "Season "+state.season+"/"+String((parseInt(state.season,10)+1)).slice(-2);
      $("#headerBadge").textContent = state.season + "/" + String((parseInt(state.season,10)+1)).slice(-2);
    }

    function renderBoard(){
      const area = $("#boardArea");
      if(!state.players.length){
        area.innerHTML = `<div class="empty">No players found in teams.json</div>`;
        return;
      }
      const scored = state.players.map(p=>{
        let total = 0, complete = true, filled = 0;
        const parts = [];
        DIVISIONS.forEach(d=>{
          const arr = p.picks[d.id] || [null,null,null,null];
          const cached = state.standings[d.id];
          arr.forEach(name=>{
            if(!name){ complete = false; return; }
            filled++;
            const live = cached && findLiveTeam(cached.teams, name);
            if(!live){ complete = false; parts.push(name+" (no standings yet)"); return; }
            total += live.rank;
            parts.push([name, live.rank]);
          });
        });
        return { name:p.name, total, complete, filled, parts };
      });
      scored.sort((a,b)=>{
        if(a.complete && !b.complete) return -1;
        if(!a.complete && b.complete) return 1;
        return a.total - b.total;
      });
      area.innerHTML = scored.map((s,i)=>`
      <div class="lb-row ${i===0 && s.complete ? 'lead':''}">
        <div class="lb-rank">${i+1}</div>
        <div>
          <div class="lb-name">${esc(s.name)}</div>
          <div class="lb-breakdown" data-breakdown="${esc(s.name)}">
            <table style="width: 100%">
              ${
                [0,4,8,12,16,1,5,9,13,17,2,6,10,14,18,3,7,11,15,19].map(i =>
                    (i < 4 ? '<tr>' : '') + '<td>' + esc(s.parts[i][0]) + '<span style="float: right; font-weight: bold">' + s.parts[i][1] + '</span></td>' + (i > 15 ? '</tr>' : '')
                ).join('')
              }
            </table>
          </div>
          <button class="toggle-picks" data-toggle="${esc(s.name)}">Show picks</button>
        </div>
        <div class="lb-total">${s.complete ? s.total : "—"}<span class="unit">${s.complete ? "pts":"incomplete"}</span></div>
      </div>`).join("");

      // Attach toggle listeners
      $$(".toggle-picks").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const playerName = btn.dataset.toggle;
          const breakdown = document.querySelector(`[data-breakdown="${playerName}"]`);
          if(breakdown){
            breakdown.classList.toggle("expanded");
            btn.textContent = breakdown.classList.contains("expanded") ? "Hide picks" : "Show picks";
          }
        });
      });
    }

    // ---------- init & auto-refresh on load ----------
    async function init(){
      // Load players from teams.json
      const playerData = await loadPlayers();
      state.season = playerData.season || state.season;
      state.players = playerData.players || [];

      // Load cached standings from storage
      state.standings = await safeGet("standings", true, {});

      renderSeasonBadge();
      renderBoard();

      // Auto-refresh all standings on page load
      await refreshAllDivisions($("#refreshStatus"));
    }

    init();

  })();
</script>
</body>
</html>
